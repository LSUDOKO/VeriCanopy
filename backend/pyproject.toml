[project]
name = "vericanopy-backend"
version = "0.1.0"
description = "VeriCanopy API, chain indexer, oracle worker"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "web3>=7.0",
  "httpx>=0.27",
  "slowapi>=0.1.9",
  "python-multipart>=0.0.9",
  "alembic>=1.13",
  "vericanopy-ai",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vericanopy-resolve = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv.sources]
vericanopy-ai = { path = "../ai", editable = true }

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
