name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.4.2 }
      - run: cd contracts && forge fmt --check
      - run: cd contracts && forge build --sizes
      - run: cd contracts && forge test -vv
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv --python 3.11 && VIRTUAL_ENV=$PWD/.venv uv pip install -e "./ai[dev]"
      - run: cd ai && ../.venv/bin/ruff check .
      - run: cd ai && ../.venv/bin/python -m pytest -q -m "not slow"
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.4.2 }
      - run: uv venv .venv --python 3.11 && VIRTUAL_ENV=$PWD/.venv uv pip install -e "./ai[dev]" -e "./backend[dev]"
      - run: cd backend && ../.venv/bin/ruff check .
      - run: cd backend && ../.venv/bin/python -m pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: cd web && pnpm install --frozen-lockfile
      - run: cd web && pnpm lint
      - run: cd web && pnpm test
      - run: cd web && pnpm build
